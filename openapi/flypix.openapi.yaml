          type: "number"
          maximum: 1.0
          minimum: 0.0
          title: "Confidence"
      type: "object"
      required:
        - "polygon"
        - "confidence"
      title: "AnnotationGeometryPayload"
    AnnotationId:
      type: "integer"
    AnyMessageContext:
      oneOf:
        - $ref: "#/components/schemas/DataContext"
      discriminator:
        propertyName: "type"
        mapping:
          data: "#/components/schemas/DataContext"
    ApplyModelRequest:
      properties:
        file_id:
          type: "string"
          format: "uuid"
          title: "File Id"
          description: "A string in UUID format"
          example: "123e4567-e89b-12d3-a456-426614174000"
      type: "object"
      required:
        - "file_id"
      title: "ApplyModelRequest"
    ApplyModelResponse:
      properties:
        status:
          $ref: "#/components/schemas/InferenceStatus"
        data:
          anyOf:
            - additionalProperties: true
              type: "object"
            - type: "null"
          title: "Data"
