openapi: "3.1.0"
info:
  title: "Public API"
  version: "0.1.0"
  description: "\nPublic OpenAPI Schema\n\nThis API lets you interact directly with the application with HTTP requests.\n\nYou will need to set a valid authorization header for every request:\n\n`Authorization: Bearer <token>`\n\nExample use case: Find an existing file and its vector features:\n\n```\nPOST /auth/login/password -> Fetch token and use it in subsequent requests\nGET /users/tenant/for-user/ -> Get your tenant id for subsequent requests\nGET /projects/for-tenant/{tenant_id} -> Find your project\nGET /files/for-project/{project_id} -> Find your file\nGET /files/{file_id}/visible -> Get a download link for the visible raster\nGET /vectors/for-file/{file_id} -> Get the vector ids for the file\nGET /vectors/{vector_id}/features -> Get the annotations\n```\n\n\n"
paths:
  /auth/login/password:
    post:
      tags:
        - "Auth"
      summary: "Login With Password"
      description: "Retrieve a short lived auth token using your username and password.\nOnly accounts created directly in the app are supported, third party accounts (Google, Linkedin) are not supported"
      operationId: "auth_login_with_password"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: "Successful Response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
      x-speakeasy-name-override: login_with_password
      # Login is public: it exchanges credentials for a token, so it must not
      # require a bearer token. The upstream (FastAPI) spec applies the global
      # BearerAuth to every operation; override it to no security here so the
      # generated method doesn't send an Authorization header.
      security: []
  /auth/refresh:
    post:
