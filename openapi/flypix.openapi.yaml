  /files/upload:
    post:
      tags:
        - "Files"
      summary: "Upload File"
      description: "**DEPRECATED**: This endpoint is deprecated and will be removed in a future version, use\n[v2/files/upload](/#/operations/upload_file_v2) instead.\n\nUpload a raster file to the specified folder. If folder_id is not included,\nthe file will be uploaded to the project root.\nValid file formats: TIFF.\nExample:\n```bash\ncurl -X 'POST' '(...)/files/upload  \\\n    -H 'accept: application/json' \\\n    -H 'Content-Type: application/octet-stream' \\\n    -H 'Authorization: Bearer eyJ... \\\n    --url-query tenant_id=34f67787-dc22-4894-8fa8-74b450c44f6f \\\n    --url-query project_id=db7642d5-8b11-4057-b1be-b5a554c227c9 \\\n    --url-query filename=rgba.tiff \\\n    --data-binary @sentinel-2-data-2024-12-16.tiff \n```"
      operationId: "files_upload"
      deprecated: true
      parameters:
        - name: "tenant_id"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Tenant Id"
        - name: "project_id"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Project Id"
        - name: "folder_id"
          in: "query"
          required: false
          schema:
            anyOf:
              - type: "string"
                format: "uuid"
              - type: "null"
            title: "Folder Id"
        - name: "filename"
          in: "query"
          required: true
          schema:
            type: "string"
            title: "Filename"
      responses:
        "200":
          description: "Successful Response"
          content:
            application/json:
              schema: {}
      x-speakeasy-name-override: upload
      # FastAPI reads the raw request stream via the Request object, so it never
      # documents a body. Without this, the generated method sends the query
      # params but no file bytes. Declare the octet-stream body so the SDK
      # generates a `body` parameter that streams the file.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
