      summary: "Upload File"
      description: "NOTE: This endpoint cannot be triggered directly from this UI\nUpload a raster file to the specified folder. If folder_id is not included,\nthe file will be uploaded to the project root.\nValid file formats: TIFF.\nExample:\n```bash\ncurl -X 'POST' '(...)/v2/files/upload  \\\n    -H 'accept: application/json' \\\n    -H 'Content-Type: application/octet-stream' \\\n    -H 'Authorization: Bearer eyJ... \\\n    --url-query tenant_id=34f67787-dc22-4894-8fa8-74b450c44f6f \\\n    --url-query project_id=db7642d5-8b11-4057-b1be-b5a554c227c9 \\\n    --url-query filename=rgba.tiff \\\n    --data-binary @sentinel-2-data-2024-12-16.tiff \n```"
      operationId: "files_upload_v2"
      parameters:
        - name: "tenant_id"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Tenant Id"
        - name: "project_id"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "uuid"
            title: "Project Id"
        - name: "folder_id"
          in: "query"
          required: false
          schema:
            anyOf:
              - type: "string"
                format: "uuid"
              - type: "null"
            title: "Folder Id"
        - name: "filename"
          in: "query"
          required: true
          schema:
            type: "string"
