          $ref: "#/components/schemas/PolygonB64"
        metadata:
          $ref: "#/components/schemas/RegionMetadata"
        training_behavior:
          $ref: "#/components/schemas/RegionTrainingBehavior"
        inference_behavior:
          $ref: "#/components/schemas/RegionInferenceBehavior"
      type: "object"
      required:
        - "region_id"
        - "tenant_id"
        - "project_id"
        - "file_id"
        - "polygon"
        - "metadata"
        - "training_behavior"
        - "inference_behavior"
      title: "RegionResponse"
    RegionTrainingBehavior:
      type: "string"
      enum:
        - "TRAINING"
        - "VALIDATION"
        - "TEST"
        - "IGNORE"
      title: "RegionTrainingBehavior"
    ResponseStatus:
      type: "string"
      enum:
        - "SUCCESS"
        - "FAILED"
        - "DELETED"
        - "APPLIED"
      title: "ResponseStatus"
    SendMessageRequest:
      properties:
        user_message:
          type: "string"
          maxLength: 10000
          minLength: 1
          format: "text"
          title: "User Message"
          description: "A string based value object"
          example: "New String"
        vector_ids:
          items:
            type: "string"
            format: "uuid"
            description: "A string in UUID format"
            example: "123e4567-e89b-12d3-a456-426614174000"
          type: "array"
          title: "Vector Ids"
        context:
          anyOf:
            - items:
                $ref: "#/components/schemas/AnyMessageContext"
              type: "array"
            - type: "null"
          title: "Context"
      type: "object"
      required:
        - "user_message"
        - "vector_ids"
      title: "SendMessageRequest"
    TenantResponse:
      properties:
        tenant_id:
          type: "string"
          format: "uuid"
          title: "Tenant Id"
          description: "A string in UUID format"
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: "string"
          maxLength: 50
          minLength: 3
          title: "Name"
      type: "object"
      required:
        - "tenant_id"
        - "name"
      title: "TenantResponse"
    Transaction:
      properties:
        transaction_id:
          type: "string"
          format: "uuid"
          title: "Transaction Id"
          description: "A string in UUID format"
          example: "123e4567-e89b-12d3-a456-426614174000"
        tenant_id:
          type: "string"
          format: "uuid"
          title: "Tenant Id"
          description: "A string in UUID format"
          example: "123e4567-e89b-12d3-a456-426614174000"
        project_id:
          anyOf:
            - type: "string"
              format: "uuid"
              description: "A string in UUID format"
              example: "123e4567-e89b-12d3-a456-426614174000"
            - type: "null"
          title: "Project Id"
        reference_id:
          anyOf:
            - type: "string"
              format: "uuid"
              description: "A string in UUID format"
              example: "123e4567-e89b-12d3-a456-426614174000"
            - type: "null"
          title: "Reference Id"
        credits:
          type: "integer"
          title: "Credits"
        reason:
          $ref: "#/components/schemas/Reason"
        type:
          $ref: "#/components/schemas/TransactionType"
        created_at:
          type: "string"
          format: "date-time"
          title: "Created At"
      type: "object"
      required:
        - "transaction_id"
        - "tenant_id"
        - "project_id"
        - "reference_id"
        - "credits"
        - "reason"
        - "type"
        - "created_at"
      title: "Transaction"
    TransactionType:
      type: "string"
      enum:
        - "ADD"
        - "SUBTRACT"
        - "WITHHOLD"
      title: "TransactionType"
    UploadAnnotationsResponse:
      properties:
        annotation_ids:
          items:
            $ref: "#/components/schemas/AnnotationId"
          type: "array"
          title: "Annotation Ids"
        errored:
          $ref: "#/components/schemas/ErroredUploadedAnnotations"
      type: "object"
      required:
        - "annotation_ids"
        - "errored"
      title: "UploadAnnotationsResponse"
    UploadFileResponseStatus:
      properties:
        file_id:
          type: "string"
          format: "uuid"
          title: "File Id"
          description: "A string in UUID format"
          example: "123e4567-e89b-12d3-a456-426614174000"
        status:
          $ref: "#/components/schemas/FileStatus"
      type: "object"
      required:
        - "file_id"
        - "status"
      title: "UploadFileResponseStatus"
    UploadSource:
      properties:
        type:
          type: "string"
          const: "UPLOAD"
          title: "Type"
          default: "UPLOAD"
        processed_file_id:
          anyOf:
            - type: "string"
              format: "uuid"
              description: "A string in UUID format"
              example: "123e4567-e89b-12d3-a456-426614174000"
            - type: "null"
          title: "Processed File Id"
        reprojected_file_id:
          anyOf:
            - type: "string"
              format: "uuid"
              description: "A string in UUID format"
              example: "123e4567-e89b-12d3-a456-426614174000"
            - type: "null"
          title: "Reprojected File Id"
      type: "object"
      required:
        - "processed_file_id"
        - "reprojected_file_id"
      title: "UploadSource"
    UsageResponse:
      properties:
        tenant_id:
          type: "string"
          format: "uuid"
          title: "Tenant Id"
          description: "A string in UUID format"
          example: "123e4567-e89b-12d3-a456-426614174000"
        bytes:
          type: "integer"
          title: "Bytes"
        storage_quota:
          type: "integer"
          title: "Storage Quota"
      type: "object"
      required:
        - "tenant_id"
        - "bytes"
        - "storage_quota"
      title: "UsageResponse"
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: "string"
              - type: "integer"
          type: "array"
          title: "Location"
        msg:
          type: "string"
          title: "Message"
        type:
          type: "string"
          title: "Error Type"
        input:
          title: "Input"
        ctx:
          type: "object"
          title: "Context"
      type: "object"
      required:
        - "loc"
        - "msg"
        - "type"
      title: "ValidationError"
    VectorClassesMap:
      additionalProperties:
        type: "string"
      type: "object"
    VectorCreationSource:
      type: "string"
      enum:
        - "DIRECT"
        - "INFERENCE"
      title: "VectorCreationSource"
    VectorFeatures:
      properties:
        data:
          $ref: "#/components/schemas/VectorFeaturesDict"
        classes:
          $ref: "#/components/schemas/VectorClassesMap"
      type: "object"
      required:
        - "data"
        - "classes"
      title: "VectorFeatures"
      description: "This data structure contains the annotations.\nThe elements in each array map by index. i.e. the first annotation would correspond\nwith `(ids[0], areas[0], polygons[0], confidences[0], class_ids[0])`.\n\nThe polygon is indicated as a WKB string (Base64).\nThe class id is indicated as an integer that\nmaps to the `classes` property"
    VectorFeaturesDict:
      properties:
        ids:
          items:
            type: "integer"
          type: "array"
          title: "Ids"
        areas:
          items:
            type: "number"
          type: "array"
          title: "Areas"
        polygons:
          items:
            type: "string"
          type: "array"
          title: "Polygons"
        confidences:
          items:
            type: "number"
          type: "array"
          title: "Confidences"
        class_ids:
          items:
            type: "integer"
          type: "array"
          title: "Class Ids"
      type: "object"
      required:
        - "ids"
        - "areas"
        - "polygons"
        - "confidences"
        - "class_ids"
      title: "VectorFeaturesDict"
    VectorMetadata:
      properties:
        source:
          $ref: "#/components/schemas/VectorCreationSource"
      type: "object"
      required:
        - "source"
      title: "VectorMetadata"
    VectorResponse:
      properties:
        tenant_id:
          type: "string"
          format: "uuid"
          title: "Tenant Id"
          description: "A string in UUID format"
          example: "123e4567-e89b-12d3-a456-426614174000"
        project_id:
          type: "string"
          format: "uuid"
          title: "Project Id"
          description: "A string in UUID format"
          example: "123e4567-e89b-12d3-a456-426614174000"
        vector_id:
          type: "string"
          format: "uuid"
          title: "Vector Id"
          description: "A string in UUID format"
          example: "123e4567-e89b-12d3-a456-426614174000"
        metadata:
          $ref: "#/components/schemas/VectorMetadata"
        name:
          type: "string"
          maxLength: 200
          minLength: 3
          title: "Name"
      type: "object"
      required:
        - "tenant_id"
        - "project_id"
        - "vector_id"
        - "metadata"
        - "name"
      title: "VectorResponse"
    WMTSLayer:
      type: "string"
    WMTSSource:
      properties:
        type:
          type: "string"
          const: "WMTS"
          title: "Type"
          default: "WMTS"
        layer:
          $ref: "#/components/schemas/WMTSLayer"
        url:
          type: "string"
          title: "Url"
      type: "object"
      required:
        - "layer"
        - "url"
      title: "WMTSSource"
  securitySchemes:
    BearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Paste your Bearer token here to use it with every request."
security:
  - BearerAuth: []
servers:
  - url: https://api.flypix.ai
    description: FlyPix production API
tags:
  - name: Auth
    description: Obtain and refresh API access tokens.
  - name: Files
    description: Upload, download, list, and delete files.
  - name: Folders
    description: Organize files into folders within a project.
  - name: Geosense
    description: GeoSense sessions, artifacts, and messages.
  - name: Inferences
    description: Inference results across tenants, projects, and files.
  - name: Models
    description: List, apply, and manage detection models.
  - name: Payments
    description: Billing and tenant balance.
  - name: Projects
    description: Manage projects within a tenant.
  - name: Rasters
    description: Raster imagery associated with files and projects.
  - name: Regions
    description: Regions of interest within a file.
  - name: Users
    description: User account details and tenant membership.
  - name: Vectors
    description: Vector data — classes, features, and annotations.
