    description: get_tenants_for_user_users_tenants_for_user__get -> users.list_tenants
    update:
      operationId: users_list_tenants
      x-speakeasy-name-override: list_tenants
      # Make this the README's showcase operation. By default Speakeasy uses the
      # first operation in the spec (auth.login_with_password) for the top-level
      # Usage/Authentication/Retries/Errors/Server-Selection snippets, which is
      # nonsensical: those sections init the client with an API key and then call
      # login_with_password (a no-auth endpoint that *returns* a token). This op
      # takes no params and requires auth, so it reads correctly with api_key.
      x-speakeasy-usage-example:
        title: List tenants for the current user
        position: 1
  - target: $.paths["/v2/files/upload"].post
    description: upload_file_v2_files_upload_post -> files.upload_v2
    update:
      operationId: files_upload_v2
      x-speakeasy-name-override: upload_v2
      # See note on /files/upload above: the raw octet-stream body is undocumented
      # upstream, so declare it here to make the file bytes actually get sent.
      requestBody:
