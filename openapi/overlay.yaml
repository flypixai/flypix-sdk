overlay: 1.0.0
info:
  title: FlyPix SDK overlay
  version: 0.1.0
actions:
  - target: $
    update:
      servers:
        - url: https://api.flypix.ai
          description: FlyPix production API
  # Declare the tags globally. The upstream (FastAPI) spec omits a top-level
  # `tags` list, so every operation's tag is "undefined" per the linter. Declaring
  # them here clears those warnings and gives each SDK namespace a description.
  - target: $
    update:
      tags:
        - name: Auth
          description: Obtain and refresh API access tokens.
        - name: Files
          description: Upload, download, list, and delete files.
        - name: Folders
          description: Organize files into folders within a project.
        - name: Geosense
          description: GeoSense sessions, artifacts, and messages.
        - name: Inferences
          description: Inference results across tenants, projects, and files.
        - name: Models
          description: List, apply, and manage detection models.
        - name: Payments
          description: Billing and tenant balance.
        - name: Projects
          description: Manage projects within a tenant.
        - name: Rasters
          description: Raster imagery associated with files and projects.
        - name: Regions
          description: Regions of interest within a file.
        - name: Users
          description: User account details and tenant membership.
        - name: Vectors
          description: Vector data — classes, features, and annotations.
  # Prefer API key auth in generated examples, README, and usage snippets.
  # Speakeasy uses the FIRST entry in the global `security` list to render those
  # snippets; upstream lists BearerAuth first. Reorder so ApiKey wins. (Overlay
  # `update` appends to arrays rather than replacing, so remove the list first,
  # then re-add it in the desired order.)
  - target: $.security
    remove: true
  - target: $
    update:
      security:
        - ApiKey: []
        - BearerAuth: []
  - target: $.paths["/auth/login/password"].post
    description: login_with_password_auth_login_password_post -> auth.login_with_password
    update:
      operationId: auth_login_with_password
      x-speakeasy-name-override: login_with_password
      # Login is public: it exchanges credentials for a token, so it must not
      # require a bearer token. The upstream (FastAPI) spec applies the global
      # BearerAuth to every operation; override it to no security here so the
      # generated method doesn't send an Authorization header.
      security: []
  - target: $.paths["/auth/refresh"].post
    description: refresh_token_auth_refresh_post -> auth.refresh_token
    update:
      operationId: auth_refresh_token
      x-speakeasy-name-override: refresh_token
  - target: $.paths["/files/for-project/{project_id}"].get
    description: get_files_for_project_root_files_for_project__project_id__get -> files.list_for_project
    update:
      operationId: files_list_for_project
      x-speakeasy-name-override: list_for_project
  - target: $.paths["/files/for-folder/{folder_id}"].get
    description: get_for_folder_files_for_folder__folder_id__get -> files.list_for_folder
    update:
      operationId: files_list_for_folder
      x-speakeasy-name-override: list_for_folder
  - target: $.paths["/files/{file_id}"].get
    description: get_file_files__file_id__get -> files.get
    update:
      operationId: files_get
      x-speakeasy-name-override: get
  - target: $.paths["/files/{file_id}"].delete
    description: delete_file_files__file_id__delete -> files.delete
    update:
      operationId: files_delete
      x-speakeasy-name-override: delete
  - target: $.paths["/files/{file_id}/visible"].get
    description: get_visible_raster_of_file_files__file_id__visible_get -> files.get_visible_raster
    update:
      operationId: files_get_visible_raster
      x-speakeasy-name-override: get_visible_raster
  - target: $.paths["/files/{file_id}/download"].get
    description: get_file_download_link_files__file_id__download_get -> files.get_download_link
    update:
      operationId: files_get_download_link
      x-speakeasy-name-override: get_download_link
  - target: $.paths["/files/by-ids"].post
    description: get_files_by_ids_files_by_ids_post -> files.get_by_ids
    update:
      operationId: files_get_by_ids
      x-speakeasy-name-override: get_by_ids
  - target: $.paths["/files/usage/{tenant_id}"].get
    description: get_storage_usage_files_usage__tenant_id__get -> files.get_storage_usage
    update:
      operationId: files_get_storage_usage
      x-speakeasy-name-override: get_storage_usage
  - target: $.paths["/files/upload"].post
    description: upload_file_files_upload_post -> files.upload
    update:
      operationId: files_upload
      x-speakeasy-name-override: upload
      # FastAPI reads the raw request stream via the Request object, so it never
      # documents a body. Without this, the generated method sends the query
      # params but no file bytes. Declare the octet-stream body so the SDK
      # generates a `body` parameter that streams the file.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
  - target: $.paths["/folders/for-folder/{folder_id}"].get
    description: get_folders_for_folder_folders_for_folder__folder_id__get -> folders.list_for_folder
    update:
      operationId: folders_list_for_folder
      x-speakeasy-name-override: list_for_folder
  - target: $.paths["/folders/for-project/{project_id}"].get
