name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  spec:
    name: Lint OpenAPI spec
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install Speakeasy CLI
        # Pinned: v1.793.0 fails every lint with
        # "generation access state is required; use generation-context/access.WithDirect or WithAuthenticated"
        env:
          VERSION: 1.792.0
        run: curl -fsSL https://go.speakeasy.com/cli-install.sh | sh
      - name: Lint spec + overlay
        run: speakeasy lint openapi --schema ./openapi/flypix.openapi.yaml
        env:
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}

  code:
    name: Type-check & lint SDK
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dev dependencies
        run: uv sync --group dev
      - name: mypy
        run: uv run mypy src
      - name: pyright
        run: uv run pyright
      - name: pylint
        run: uv run pylint src/flypix --rcfile=pylintrc
