# Publishes to PyPI when a generation PR is merged to main (Speakeasy tracks
# release state via RELEASES.md, which its generation action maintains).
name: Publish SDK

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - RELEASES.md
      - "**/pyproject.toml"

jobs:
  publish:
    uses: speakeasy-api/sdk-generation-action/.github/workflows/sdk-publish.yaml@v15
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
      pypi_token: ${{ secrets.PYPI_TOKEN }}
      speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
